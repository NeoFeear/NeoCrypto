data_source: binance

watchlist:
  - BTCUSDT
  - ETHUSDT
  - SOLUSDT
  - BNBUSDT

liquidity:
  min_quote_volume_24h: 50000000
  max_spread_bps: 10

backtest:
  initial_capital: 1000
  interval: 1h
  lookback_days: 90

fees:
  default_fee_pct: 0.001

live:
  poll_interval_seconds: 300
  poll_kline_interval: 5m

snapshots:
  retention_detail_days: 30

strategy_defaults:
  buy_hold:
    invest_at: start
  dca:
    amount_per_buy: 50
    frequency_hours: 24
    reference_price: close
  grid:
    lower_bound: 25000
    upper_bound: 35000
    n_levels: 10
    spacing: geometric
    order_size_quote: 100
